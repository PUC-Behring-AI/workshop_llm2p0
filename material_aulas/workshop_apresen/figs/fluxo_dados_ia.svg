<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="810" viewBox="0 0 1000 810" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Caminho dos dados em uma aplicação de IA</title>
  <desc>Diagrama do caminho de um texto digitado em um assistente de IA na nuvem: do usuário ao aplicativo, à internet e ao provedor, que se ramifica em inferência, ferramentas remotas, registros e subcontratados. Tudo a partir do provedor está fora do controle do órgão. Ferramentas locais e remotas são possíveis portas de vazamento, e o conteúdo que elas trazem volta ao contexto do modelo. Duas perguntas valem para todos os ramos: se o dado pode treinar modelos e sob qual lei, e quem pode exigir acesso a ele.</desc>
  <defs>
    <!-- pontas de seta com cor fixa (não dependem de context-stroke) -->
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#4A4A48" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="810" fill="#FFFFFF"/>

  <!-- Ferramentas locais -->
  <rect x="120" y="30" width="320" height="92" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="280" y="57" text-anchor="middle" font-size="18" font-weight="600" fill="#4A1B0C">Ferramentas locais</text>
  <text x="280" y="82" text-anchor="middle" font-size="16" fill="#712B13">O que elas podem ler?</text>
  <text x="280" y="106" text-anchor="middle" font-size="15" fill="#712B13">arquivos, código, apps no computador</text>

  <line x1="280" y1="126" x2="280" y2="156" stroke="#993C1D" stroke-width="1.6" marker-start="url(#arrR)" marker-end="url(#arrR)"/>
  <text x="294" y="146" font-size="15" font-weight="500" fill="#712B13">o que é lido segue junto com a pergunta</text>

  <!-- Linha superior -->
  <rect x="30" y="160" width="120" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="90" y="196" text-anchor="middle" font-size="18" font-weight="600" fill="#04342C">Você</text>

  <rect x="190" y="160" width="180" height="60" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="280" y="185" text-anchor="middle" font-size="18" font-weight="600" fill="#04342C">Aplicativo</text>
  <text x="280" y="207" text-anchor="middle" font-size="15" fill="#085041">ou navegador</text>

  <rect x="410" y="160" width="180" height="60" rx="8" fill="#EDEDEB" stroke="#7A7A76" stroke-width="1"/>
  <text x="500" y="185" text-anchor="middle" font-size="18" font-weight="600" fill="#2A2A28">Internet</text>
  <text x="500" y="207" text-anchor="middle" font-size="15" fill="#3A3A38">trânsito, fora do órgão</text>

  <line x1="152" y1="190" x2="186" y2="190" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="372" y1="190" x2="406" y2="190" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="500" y1="222" x2="500" y2="276" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- Legenda (canto superior direito) -->
  <text x="650" y="40" font-size="15" font-weight="600" fill="#2A2A28">Legenda</text>
  <rect x="650" y="52" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text x="674" y="65" font-size="15" fill="#2A2A28">Seu lado (dentro do órgão)</text>
  <rect x="650" y="76" width="16" height="16" rx="3" fill="#EDEDEB" stroke="#7A7A76"/>
  <text x="674" y="89" font-size="15" fill="#2A2A28">Trânsito</text>
  <rect x="650" y="100" width="16" height="16" rx="3" fill="#F3ECDD" stroke="#A08C66"/>
  <text x="674" y="113" font-size="15" fill="#2A2A28">Sob responsabilidade do provedor</text>
  <rect x="650" y="124" width="16" height="16" rx="3" fill="#FAECE7" stroke="#993C1D"/>
  <text x="674" y="137" font-size="15" fill="#2A2A28">Ferramentas: risco de vazamento</text>
  <rect x="650" y="148" width="16" height="16" rx="3" fill="#E8F0F8" stroke="#1F4E79" stroke-width="2"/>
  <text x="674" y="161" font-size="15" fill="#2A2A28">Pergunta-chave (soberania)</text>
  <line x1="650" y1="180" x2="666" y2="180" stroke="#3A3A38" stroke-width="1.6" stroke-dasharray="5 3"/>
  <text x="674" y="185" font-size="15" fill="#2A2A28">Fora do controle do órgão</text>

  <!-- Moldura: fora do controle -->
  <rect x="10" y="248" width="980" height="332" rx="14" fill="none" stroke="#3A3A38" stroke-width="1.6" stroke-dasharray="8 6"/>
  <text x="30" y="276" font-size="17" font-weight="600" fill="#2A2A28">Fora do controle do órgão</text>

  <!-- Provedor -->
  <rect x="320" y="280" width="360" height="60" rx="8" fill="#F3ECDD" stroke="#A08C66" stroke-width="1"/>
  <text x="500" y="305" text-anchor="middle" font-size="18" font-weight="600" fill="#3E3120">Provedor do serviço</text>
  <text x="500" y="327" text-anchor="middle" font-size="15" fill="#4A3B22">ex.: nuvem de empresa estrangeira, no país ou fora</text>

  <!-- Barramento -->
  <line x1="500" y1="340" x2="500" y2="365" stroke="#4A4A48" stroke-width="1.6"/>
  <line x1="137" y1="365" x2="863" y2="365" stroke="#4A4A48" stroke-width="1.6"/>
  <line x1="137" y1="365" x2="137" y2="391" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="379" y1="365" x2="379" y2="391" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="621" y1="365" x2="621" y2="391" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <line x1="863" y1="365" x2="863" y2="391" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>

  <!-- Ramos -->
  <rect x="22" y="395" width="230" height="104" rx="8" fill="#F3ECDD" stroke="#A08C66" stroke-width="1"/>
  <text x="137" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#3E3120">Inferência</text>
  <text x="137" y="452" text-anchor="middle" font-size="16" fill="#4A3B22">Onde o modelo roda?</text>
  <text x="137" y="477" text-anchor="middle" font-size="15" fill="#4A3B22">país e empresa responsável</text>

  <rect x="264" y="395" width="230" height="104" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="379" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#4A1B0C">Ferramentas remotas</text>
  <text x="379" y="452" text-anchor="middle" font-size="16" fill="#712B13">O que podem ler e enviar?</text>
  <text x="379" y="477" text-anchor="middle" font-size="15" fill="#712B13">busca, e-mail, Drive, APIs</text>

  <rect x="506" y="395" width="230" height="104" rx="8" fill="#F3ECDD" stroke="#A08C66" stroke-width="1"/>
  <text x="621" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#3E3120">Registros</text>
  <text x="621" y="452" text-anchor="middle" font-size="16" fill="#4A3B22">O que fica guardado?</text>
  <text x="621" y="477" text-anchor="middle" font-size="15" fill="#4A3B22">logs, prazo, revisão humana</text>

  <rect x="748" y="395" width="230" height="104" rx="8" fill="#F3ECDD" stroke="#A08C66" stroke-width="1"/>
  <text x="863" y="424" text-anchor="middle" font-size="18" font-weight="600" fill="#3E3120">Subcontratados</text>
  <text x="863" y="452" text-anchor="middle" font-size="16" fill="#4A3B22">Quem mais toca no dado?</text>
  <text x="863" y="477" text-anchor="middle" font-size="15" fill="#4A3B22">nuvem, infraestrutura</text>

  <!-- Caminho de volta: conteúdo externo -->
  <path d="M379 503 C379 540, 137 540, 137 507" fill="none" stroke="#993C1D" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrR)"/>
  <text x="258" y="560" text-anchor="middle" font-size="15" font-weight="500" fill="#712B13">volta: conteúdo externo entra no contexto do modelo</text>

  <!-- Perguntas comuns -->
  <line x1="500" y1="582" x2="500" y2="606" stroke="#4A4A48" stroke-width="1.6" marker-end="url(#arrG)"/>
  <rect x="10" y="610" width="980" height="180" rx="14" fill="#F6F6F4" stroke="#8A8A86" stroke-width="1"/>
  <text x="500" y="638" text-anchor="middle" font-size="17" font-weight="600" fill="#2A2A28">Perguntas que valem para todos os ramos</text>

  <rect x="30" y="654" width="440" height="118" rx="8" fill="#FFFFFF" stroke="#6A6A66" stroke-width="1"/>
  <text x="250" y="688" text-anchor="middle" font-size="18" font-weight="600" fill="#1F1F1E">O dado pode treinar modelos?</text>
  <text x="250" y="720" text-anchor="middle" font-size="16" fill="#2E2E2C">Depende do plano contratado:</text>
  <text x="250" y="744" text-anchor="middle" font-size="16" fill="#2E2E2C">pessoal, empresarial ou API</text>

  <rect x="490" y="654" width="480" height="118" rx="8" fill="#E8F0F8" stroke="#1F4E79" stroke-width="2.4"/>
  <text x="730" y="688" text-anchor="middle" font-size="18" font-weight="700" fill="#0F2A47">Sob que lei, e quem pode exigir acesso?</text>
  <text x="730" y="716" text-anchor="middle" font-size="15" fill="#1B3F66">Soberania: valem as leis do país do servidor</text>
  <text x="730" y="738" text-anchor="middle" font-size="15" fill="#1B3F66">e da sede da empresa (ex.: CLOUD Act, EUA),</text>
  <text x="730" y="760" text-anchor="middle" font-size="15" fill="#1B3F66">mesmo que o servidor esteja no Brasil</text>
</svg>
